<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego Adivinar Palabra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <select id="tematicas"></select>
        <label>
            <input type="checkbox" id="extenderAbecedario"> Usar abecedario extendido
        </label>
        <button id="comenzarJuego" onclick="iniciarJuego()">Començar partida</button>
    </header>
    <div id="register-box">
        <h3>Registro</h3>
        <form id="registerForm">
          <label for="regNom">Nombre</label>
          <input type="text" id="regNom" name="nom" required>
          <label for="regEmail">Correo</label>
          <input type="email" id="regEmail" name="email" required>
          <label for="regPassword">Contraseña</label>
          <input type="password" id="regPassword" name="password" required>
          <button type="submit">Registrarse</button>
          <div class="message" id="registerMessage"></div>
        </form>
      </div>
      <div id="login-box">
        <h3>Login</h3>
        <form id="loginForm">
          <label for="loginEmail">Correo</label>
          <input type="email" id="loginEmail" name="email" required>
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" name="password" required>
          <button type="submit">Iniciar Sesión</button>
          <div class="message" id="loginMessage"></div>
        </form>
      </div>
    <section id="juego">
        <div id="palabraOculta"></div>
        <div id="intentosRestantes">
            <img srcset="\img\img_10.jpg"/>
        </div>
        <div id="botonesLetras"></div>
        <div id="userStatsBox" class="stats-box">
            
        </div>
        
    </section>
    <script src="script.js"></script>
</body>
</html>
